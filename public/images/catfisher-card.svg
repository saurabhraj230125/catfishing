<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#FFFFFF"/>
  <rect x="20" y="20" width="760" height="560" fill="#FFF1F2" stroke="#111111" stroke-width="6" rx="20"/>
  
  <!-- Backdrop Shapes -->
  <polygon points="200,480 340,120 640,120 500,480" fill="#E11D48" stroke="#111111" stroke-width="6"/>
  <circle cx="500" cy="360" r="90" fill="#FBBF24" stroke="#111111" stroke-width="6"/>
  
  <!-- Cloaked Character Body -->
  <path d="M 270,560 C 270,420 330,370 400,370 C 470,370 530,420 530,560 Z" fill="#18181B" stroke="#111111" stroke-width="8"/>
  
  <!-- Disguise Mask & Sunglasses -->
  <circle cx="400" cy="270" r="85" fill="#FFE0BD" stroke="#111111" stroke-width="8"/>
  <path d="M 310,240 C 310,160 490,160 490,240 C 470,210 440,200 400,200 C 360,200 330,210 310,240 Z" fill="#18181B"/>
  
  <!-- Venetian Style Mask / Dark Sunglasses -->
  <rect x="325" y="245" width="150" height="48" rx="14" fill="#111111" stroke="#E11D48" stroke-width="4"/>
  <circle cx="360" cy="269" r="14" fill="#3B82F6"/>
  <circle cx="440" cy="269" r="14" fill="#3B82F6"/>
  
  <!-- Smirk -->
  <path d="M 385,310 Q 410,320 425,305" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Secret Badge -->
  <rect x="60" y="60" width="220" height="48" rx="12" fill="#E11D48" stroke="#111111" stroke-width="4"/>
  <text x="170" y="92" font-family="sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">FULL GOLMAAL</text>
  
  <!-- Dialogue Pill -->
  <rect x="160" y="470" width="280" height="52" rx="16" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <text x="300" y="503" font-family="sans-serif" font-size="16" font-weight="800" fill="#E11D48" text-anchor="middle">"Pehchan kaun? Catfish Disguise."</text>
</svg>

