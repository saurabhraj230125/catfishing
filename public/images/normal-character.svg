<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#FFFFFF"/>
  <rect x="20" y="20" width="760" height="560" fill="#F6F5F2" stroke="#111111" stroke-width="6"/>
  <!-- Decorative Tactile Grid Marks -->
  <circle cx="50" cy="50" r="6" fill="#111111"/>
  <circle cx="750" cy="50" r="6" fill="#111111"/>
  <circle cx="50" cy="550" r="6" fill="#111111"/>
  <circle cx="750" cy="550" r="6" fill="#111111"/>
  
  <!-- Backdrop Shape (Cobalt Blue & Lime) -->
  <polygon points="180,480 320,120 620,120 480,480" fill="#2563EB" stroke="#111111" stroke-width="6"/>
  <rect x="420" y="280" width="180" height="180" fill="#AAFF00" stroke="#111111" stroke-width="6"/>
  
  <!-- Character Body (Chill student with headphones) -->
  <path d="M 280,560 C 280,430 340,380 400,380 C 460,380 520,430 520,560 Z" fill="#FFFFFF" stroke="#111111" stroke-width="8"/>
  <path d="M 330,420 L 400,480 L 470,420" fill="none" stroke="#111111" stroke-width="6"/>
  
  <!-- Head & Face -->
  <circle cx="400" cy="270" r="85" fill="#FFE0BD" stroke="#111111" stroke-width="8"/>
  <!-- Hair (Chill messy hair) -->
  <path d="M 315,260 C 315,170 485,170 485,260 C 470,220 440,210 400,210 C 360,210 330,220 315,260 Z" fill="#111111"/>
  
  <!-- Eyes (Relaxed, honest open eyes) -->
  <circle cx="365" cy="270" r="9" fill="#111111"/>
  <circle cx="435" cy="270" r="9" fill="#111111"/>
  <circle cx="368" cy="267" r="3" fill="#FFFFFF"/>
  <circle cx="438" cy="267" r="3" fill="#FFFFFF"/>
  <!-- Relaxed Smile -->
  <path d="M 380,305 Q 400,325 420,305" fill="none" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Headphones (Cobalt Blue over ears) -->
  <path d="M 305,270 C 305,140 495,140 495,270" fill="none" stroke="#2563EB" stroke-width="16" stroke-linecap="round"/>
  <rect x="290" y="240" width="30" height="60" rx="10" fill="#111111" stroke="#111111" stroke-width="4"/>
  <rect x="480" y="240" width="30" height="60" rx="10" fill="#111111" stroke="#111111" stroke-width="4"/>
  
  <!-- Smartphone in Hand (Chill genuine text) -->
  <rect x="440" y="380" width="90" height="150" rx="16" fill="#111111" stroke="#111111" stroke-width="6"/>
  <rect x="450" y="395" width="70" height="120" rx="8" fill="#AAFF00"/>
  <circle cx="485" cy="455" r="16" fill="#111111"/>
  <path d="M 480,455 L 490,455" stroke="#FFFFFF" stroke-width="4"/>

  <!-- Neo-Brutalist Badge -->
  <rect x="60" y="60" width="160" height="45" fill="#AAFF00" stroke="#111111" stroke-width="4"/>
  <text x="140" y="90" font-family="monospace" font-size="20" font-weight="900" fill="#111111" text-anchor="middle">NORMAL</text>
  
  <!-- Dialogue Pill -->
  <rect x="180" y="470" width="220" height="50" rx="12" fill="#FFFFFF" stroke="#111111" stroke-width="4"/>
  <text x="290" y="502" font-family="sans-serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">"Genuine me. No BS."</text>
</svg>

